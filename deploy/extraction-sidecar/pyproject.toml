[project]
name = "groundwork-extraction-sidecar"
version = "0.1.0"
description = "GLiNER2 entities and chunk tags, and BERTopic themes, for Groundwork's ingestion pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gliner2[local]>=1.0",
    "bertopic>=0.16",
    "sentence-transformers>=3.0",
]

[tool.uv]
package = false
