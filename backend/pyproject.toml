[project]
name = "groundwork"
version = "0.1.0"
description = "YSH knowledge-gathering portal API"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.2",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "openpyxl==3.1.5",
    "pydantic-settings==2.15.0",
    "pypdf==5.9.0",
    "python-multipart==0.0.32",
    "sqlalchemy==2.0.54",
    "uvicorn[standard]==0.53.0",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
