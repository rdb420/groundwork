[project]
name = "groundwork"
version = "0.1.0"
description = "YSH knowledge-gathering portal API"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.2",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "openpyxl==3.1.5",
    "pydantic-settings==2.15.0",
    "pypdf==5.9.0",
    "python-multipart==0.0.32",
    "sqlalchemy==2.0.54",
    "tokenizers>=0.23.2",
    "uvicorn[standard]==0.53.0",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8",
    "ruff>=0.16.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S110", "DTZ005"]
ignore = ["B008", "E501"]  # Depends()/File() defaults are FastAPI idiom; prompts and dict literals run long

[tool.ruff.lint.per-file-ignores]
"scripts/fake_models.py" = ["E401", "E702", "E741"]  # a throwaway stand-in, kept compact on purpose

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
