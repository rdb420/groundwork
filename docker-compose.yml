# Groundwork on one host.
#   docker compose up -d --build            production-style: app, worker, caddy
#   docker compose --profile dev up -d      adds Mailpit to catch sign-in emails at :8025
services:
  app:
    build: { context: ., dockerfile: deploy/Dockerfile, args: { WITH_WHISPER: "${WITH_WHISPER:-false}" } }
    env_file: .env
    volumes: [ "./data:/data" ]
    # Reachable from this host only (for `tailscale serve`, option C). Caddy reaches it inside compose.
    ports: [ "127.0.0.1:8000:8000" ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Files: malware check, first read, retention and hourly upkeep.
  worker:
    build: { context: ., dockerfile: deploy/Dockerfile, args: { WITH_WHISPER: "${WITH_WHISPER:-false}" } }
    env_file: .env
    command: ["python", "-m", "app.worker", "--kinds", "profile_artifact"]
    volumes: [ "./data:/data" ]
    restart: unless-stopped
    depends_on: [ app ]

  # Ingestion: converting files to Markdown waits on MinerU, so it has its own worker.
  converter:
    build: { context: ., dockerfile: deploy/Dockerfile, args: { WITH_WHISPER: "${WITH_WHISPER:-false}" } }
    env_file: .env
    command: ["python", "-m", "app.worker", "--kinds", "convert_artifact"]
    volumes: [ "./data:/data" ]
    restart: unless-stopped
    depends_on: [ app ]

  # Opens doc, ppt, odt, rtf, xls and ods files (LibreOffice) and returns PDF. Internal only.
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped

  # Transcription on its own, so a large workbook never delays a live session's transcript.
  transcriber:
    build: { context: ., dockerfile: deploy/Dockerfile, args: { WITH_WHISPER: "${WITH_WHISPER:-false}" } }
    env_file: .env
    command: ["python", "-m", "app.worker", "--kinds", "transcribe_segment"]
    volumes: [ "./data:/data" ]
    restart: unless-stopped
    depends_on: [ app ]

  # Malware scanning for uploads. Needs about 2 GB of memory and a few minutes to load signatures
  # on first start. Set GW_CLAMAV_HOST=clamav in .env to use it; leave it empty to switch off.
  clamav:
    image: clamav/clamav:stable
    volumes: [ "clamav_db:/var/lib/clamav" ]
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: [ "80:80", "443:443" ]
    environment:
      GW_HOSTNAME: "${GW_HOSTNAME:-groundwork.local}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on: [ app ]

  mailpit:
    image: axllent/mailpit
    profiles: [ "dev" ]
    ports: [ "8025:8025" ]

volumes:
  clamav_db:
  caddy_data:
  caddy_config:
