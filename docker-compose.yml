# Groundwork on one host.
#   docker compose up -d --build            production-style: app, worker, caddy
#   docker compose --profile dev up -d      adds Mailpit to catch sign-in emails at :8025
services:
  app:
    build: { context: ., dockerfile: deploy/Dockerfile, args: { WITH_WHISPER: "${WITH_WHISPER:-false}" } }
    env_file: .env
    volumes: [ "./data:/data" ]
    # Reachable from this host only (for `tailscale serve`, option C). Caddy reaches it inside compose.
    ports: [ "127.0.0.1:8000:8000" ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Files: malware check, first read, retention and hourly upkeep.
  worker:
    build: { context: ., dockerfile: deploy/Dockerfile, args: { WITH_WHISPER: "${WITH_WHISPER:-false}" } }
    env_file: .env
    command: ["python", "-m", "app.worker", "--kinds", "profile_artifact"]
    volumes: [ "./data:/data" ]
    restart: unless-stopped
    depends_on: [ app ]

  # ---- Ingestion pipeline (docs/INGESTION.md): docker compose --profile pipeline up -d ----
  # Converting files to Markdown waits on MinerU, so it has its own worker.
  converter:
    profiles: [ "pipeline" ]
    build: { context: ., dockerfile: deploy/Dockerfile, args: { WITH_WHISPER: "${WITH_WHISPER:-false}" } }
    env_file: .env
    command: ["python", "-m", "app.worker", "--kinds", "convert_artifact,transcribe_artifact"]
    volumes: [ "./data:/data" ]
    restart: unless-stopped
    depends_on: [ app ]

  # Chunks, embeds, indexes, extracts and builds the graph; also removes purged files everywhere.
  indexer:
    profiles: [ "pipeline" ]
    build: { context: ., dockerfile: deploy/Dockerfile, args: { WITH_WHISPER: "${WITH_WHISPER:-false}" } }
    env_file: .env
    command: ["python", "-m", "app.worker", "--kinds", "ingest_recording,index_chunks,extract_entities,project_graph,purge_external,topics_batch"]
    volumes: [ "./data:/data" ]
    restart: unless-stopped
    depends_on: [ app ]

  # Opens doc, ppt, odt, rtf, xls and ods files (LibreOffice) and returns PDF. Internal only.
  gotenberg:
    profiles: [ "pipeline" ]
    image: gotenberg/gotenberg:8
    restart: unless-stopped

  # Vectors. Qdrant 1.18.2 with the rba420-qdrant config (TLS on). Needs QDRANT__SERVICE__API_KEY
  # and a certificate in deploy/qdrant/tls/ (see deploy/qdrant/README.md).
  qdrant:
    profiles: [ "pipeline" ]
    image: qdrant/qdrant:v1.18.2
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:?set QDRANT_API_KEY in .env}"
      QDRANT__SERVICE__ENABLE_TLS: "true"
      QDRANT__TLS__CERT: /qdrant/tls/cert.pem
      QDRANT__TLS__KEY: /qdrant/tls/key.pem
    volumes:
      - qdrant_storage:/qdrant/storage
      - ./deploy/qdrant/tls:/qdrant/tls:ro
    restart: unless-stopped

  # The knowledge graph. Browser on this host only (http://127.0.0.1:7474); set NEO4J_PASSWORD.
  neo4j:
    profiles: [ "pipeline" ]
    image: neo4j:5
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
      NEO4J_server_memory_heap_max__size: 1G
    ports: [ "127.0.0.1:7474:7474" ]
    volumes: [ "neo4j_data:/data" ]
    restart: unless-stopped

  # Transcription on its own, so a large workbook never delays a live session's transcript.
  transcriber:
    build: { context: ., dockerfile: deploy/Dockerfile, args: { WITH_WHISPER: "${WITH_WHISPER:-false}" } }
    env_file: .env
    command: ["python", "-m", "app.worker", "--kinds", "transcribe_segment"]
    volumes: [ "./data:/data" ]
    restart: unless-stopped
    depends_on: [ app ]

  # Malware scanning for uploads. Needs about 2 GB of memory and a few minutes to load signatures
  # on first start. Set GW_CLAMAV_HOST=clamav in .env to use it; leave it empty to switch off.
  clamav:
    image: clamav/clamav:stable
    volumes: [ "clamav_db:/var/lib/clamav" ]
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: [ "80:80", "443:443" ]
    environment:
      GW_HOSTNAME: "${GW_HOSTNAME:-groundwork.local}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on: [ app ]

  mailpit:
    image: axllent/mailpit
    profiles: [ "dev" ]
    ports: [ "8025:8025" ]

volumes:
  neo4j_data:
  qdrant_storage:
  clamav_db:
  caddy_data:
  caddy_config:
